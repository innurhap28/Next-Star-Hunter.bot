[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI는 `param=Depends(...)` 패턴이 표준이라 함수 호출을 기본값으로 쓰는 것을 허용한다.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests", "test"]
pythonpath = ["backend", "."]
addopts = "-q"
