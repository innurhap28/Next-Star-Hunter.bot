<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f5f2">
    <title>{{ page_title | default("스타 헌팅 · Next Star Hunter") }}</title>
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/chat.js" defer></script>
  </head>
  <body class="chat-page">
    <div class="chat-layout">
      <aside class="sidebar" id="chat-sidebar" aria-label="대화 메뉴">
        <a class="brand" href="/" aria-label="Next Star Hunter 홈">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <span>Next Star Hunter</span>
        </a>
        <button class="button button-secondary new-chat-button" type="button" data-new-chat>
          <span aria-hidden="true">＋</span> 새 대화
        </button>
        <div class="history-heading">최근 대화</div>
        <nav class="chat-history" aria-label="최근 대화 목록" data-chat-history>
          <p class="history-empty" data-history-empty>저장된 대화가 여기에 표시됩니다.</p>
        </nav>
        <div class="sidebar-footer">
          <a class="user-profile" href="/auth">
            <span class="avatar" aria-hidden="true" data-user-avatar>{{ user_initial | default("게") }}</span>
            <span class="user-label" data-user-label>{{ user_name | default("게스트") }}</span>
            <span class="user-menu" aria-hidden="true">···</span>
          </a>
        </div>
      </aside>

      <main class="chat-main">
        <header class="chat-topbar">
          <button class="icon-button mobile-menu-button" type="button" aria-label="대화 메뉴 열기" aria-controls="chat-sidebar" aria-expanded="false" data-menu-toggle>☰</button>
          <span class="topbar-title">스타 헌팅</span>
          <a class="topbar-link" href="/auth" data-login-link>로그인</a>
          <button class="topbar-link" type="button" data-logout-button hidden>로그아웃</button>
        </header>

        <section class="conversation" aria-label="스타 추천 대화">
          <div class="welcome-block" data-welcome>
            <span class="welcome-sparkle" aria-hidden="true">✦</span>
            <p class="eyebrow">YOUR PERSONAL CASTING MANAGER</p>
            <h1>어떤 스타를 찾고 있나요?</h1>
            <p>떠오르는 취향이나 조건을 편하게 말해 주세요.<br>새로운 최애를 함께 찾아볼게요.</p>
            <div class="suggestion-list" aria-label="질문 예시">
              <button type="button" class="suggestion-chip" data-suggestion="안경이 잘 어울리는 아이돌을 추천해줘">안경이 잘 어울리는 아이돌</button>
              <button type="button" class="suggestion-chip" data-suggestion="부산 출신 배우를 찾아줘">부산 출신 배우 찾아보기</button>
              <button type="button" class="suggestion-chip" data-suggestion="오늘의 랜덤 스타를 추천해줘">오늘의 랜덤 스타</button>
            </div>
          </div>
          <div class="message-list" data-message-list aria-live="polite"></div>
        </section>

        <form class="composer" data-chat-form>
          <label class="visually-hidden" for="chat-input">스타에게 바라는 조건을 입력하세요</label>
          <textarea id="chat-input" name="message" rows="1" placeholder="찾고 싶은 스타의 조건을 입력해 주세요 (Shift+Enter 줄바꿈)" aria-describedby="chat-status" data-chat-input></textarea>
          <div class="composer-actions">
            <span class="composer-hint">AI가 추천한 정보는 참고용으로 확인해 주세요.</span>
            <button class="button button-primary send-button" type="submit" aria-label="메시지 보내기" data-send-button>↑</button>
          </div>
        </form>
        <p class="chat-status" id="chat-status" role="status" data-chat-status></p>
        <p class="chat-disclaimer">Next Star Hunter는 취향에 맞는 스타를 찾도록 도와주는 서비스입니다.</p>
      </main>
    </div>
  </body>
</html>
