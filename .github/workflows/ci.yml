name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # 기존 코드에 미해결 린트 부채가 있어(실측 48건) 전체 검사를 막이 아니라
      # 이 PR/커밋에서 바뀐 파이썬 파일만 검사한다. 부채 정리는 별도 이슈로 처리한다.
      - name: 바뀐 파이썬 파일 린트
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
              echo "기준 커밋이 없어 린트를 건너뜁니다"; exit 0
            fi
          fi
          files=$(git diff --name-only --diff-filter=ACMR "${base}...HEAD" -- '*.py' || true)
          if [ -z "${files}" ]; then echo "바뀐 파이썬 파일 없음"; exit 0; fi
          echo "${files}"
          ruff check ${files}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
